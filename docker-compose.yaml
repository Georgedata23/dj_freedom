
networks:
  shared_network:
    external: true

services:
  DjangoApp:
    container_name: django_project
    build:
      context: ./img_text
    env_file:
      - .env-django
    depends_on:
      db_django:
        condition: service_healthy
    command: [ "/src/for_docker/app.sh" ]
    ports:
      - "8000:8000"
    networks:
      - shared_network

  db_django:
    image: postgres:16
    container_name: my_project_postgres_django
    env_file:
      - .env-django
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared_network
