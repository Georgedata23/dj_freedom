<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
<p>{{ menu|join:" | " }}</p>
<h1> {{ title| upper }} </h1>
<ul>
    {% for p in posts %}
    <li>
        <b>id: {{ p.id }}</b>
        <p>{{ p.image }}</p>
        {% if not forloop.last %}
        <hr>
        {% endif %}
    </li>
    {% endfor %}
</ul>
</body>
</html>
