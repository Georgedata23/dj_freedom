<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
<p>{{ menu|join:" | " }}</p>
<h1> {{ title| upper }} </h1>
<ul>
    {% for p in posts %}

        <p>id: {{ p.id }}</p>
        <p>{{ p.image }}</p>
    </li>
    {% endfor %}
</ul>
</body>
</html>
