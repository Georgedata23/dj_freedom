{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link type="text/css" href="{% static 'mainimg/css/for_site.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="{% static 'mainimg/media/logo.png' %}" alt="Site Logo">
            <h3><a href="{% url 'home' %}">{{ menu.home }}</a></h3>
        </div>

        <nav>
            <ul>
                <li><a href="{% url 'analyse' %}">{{ menu.analyse }}</a></li>
                <li><a href="{% url 'upload' menu.id%}">{{ menu.upload }}</a></li>
                <li><a href="{% url 'get_text' %}">{{ menu.get_text }}</a></li>
                <li><a href="{% url 'logout' %}">Выйти</a></li>
                <li>Привет, {{ user.username }}!</li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Modern & Fun Django Site. All rights reserved.</p>
    </footer>
</body>
</html>
