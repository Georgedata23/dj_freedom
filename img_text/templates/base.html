{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link type="text/css" href="{% static 'mainimg/css/for_site.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="{% static 'mainimg/media/logo.png' %}"  alt="Site Logo">
            <h1>Menu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'analyse' %}">Analyse</a></li>
                <li><a href="{% url 'upload' menu.id%}">Upload</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
    <p><a href="{% url 'logout' %}">Выход из системы</a></p>
    <footer>
        <p>&copy; 2025 Fucking site for django. All rights reserved.</p>
    </footer>
</body>
</html>
